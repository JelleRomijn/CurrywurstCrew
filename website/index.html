<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurrywurstCrew</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="css/base.css?v=1">
    <link rel="stylesheet" href="css/style.css?v=1">
    <link rel="stylesheet" href="css/kaart.css?v=1">
</head>
<body>
    <h1>CurrywurstCrew</h1>

    <!-- KAART -->
    <section id="kaart" class="kaart" aria-labelledby="kaart-titel" data-kaart>
        <div class="kaart__wrap">
            <h2 id="kaart-titel" class="kaart__titel">Kaart</h2>

            <ul class="kaart__legenda" aria-label="Legenda">
                <li class="kaart__legenda-item">
                    <span class="kaart__teken kaart__teken--hotel" aria-hidden="true">H</span>
                    Hotel
                </li>
            </ul>

            <div class="kaart__kader">
                <div class="kaart__map" role="region" aria-label="Kaart met het hotel, de restaurants en de looproutes"></div>
                <div class="kaart__zoom">
                    <button type="button" class="kaart__zoom-knop" data-kaart-zoom="in" aria-label="Inzoomen">+</button>
                    <button type="button" class="kaart__zoom-knop" data-kaart-zoom="uit" aria-label="Uitzoomen">−</button>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="js/kaart-data.js?v=1"></script>
    <script src="js/kaart.js?v=4"></script>
    <script src="js/script.js?v=1"></script>
</body>
</html>
